<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101a17" />
  <meta name="description" content="Your daily rhythm for training, movement and recovery. A private, offline-capable health planner." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/move-strong-192.png" />
  <link rel="apple-touch-icon" href="./assets/icons/move-strong-192.png" />
  <link rel="stylesheet" href="./styles.css?v=3.1.0" />
  <link rel="stylesheet" href="./health-os.css?v=3.1.0" />
  <title>Move Strong Rehab</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Go back">←</button>
      <div class="brand-block">
        <span class="eyebrow">Your personal health OS</span>
        <h1 id="pageTitle">Move Strong Rehab</h1>
      </div>
      <button id="installBtn" class="install-btn hidden">Install</button>
    </header>

    <main id="mainContent" class="main-content" aria-live="polite"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Main navigation">
      <button data-route="home" class="nav-item active"><span>●</span><small>Today</small></button>
      <button data-route="plan" class="nav-item"><span>▤</span><small>Week</small></button>
      <button data-route="train" class="nav-item"><span>＋</span><small>Log</small></button>
      <button data-route="progress" class="nav-item"><span>↗</span><small>Review</small></button>
      <button data-route="settings" class="nav-item"><span>⚙</span><small>You</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="timerOverlay" class="timer-overlay hidden" role="dialog" aria-modal="true" aria-label="Rest timer">
    <div class="timer-card">
      <p class="eyebrow">Rest timer</p>
      <div id="timerDisplay" class="timer-display">01:30</div>
      <div class="timer-controls">
        <button id="timerMinus" class="secondary-btn">−15 sec</button>
        <button id="timerPause" class="primary-btn">Pause</button>
        <button id="timerPlus" class="secondary-btn">+15 sec</button>
      </div>
      <button id="timerClose" class="text-btn">Close timer</button>
    </div>
  </div>

  <div id="exerciseOverlay" class="guide-overlay hidden" role="dialog" aria-modal="true" aria-label="Exercise technique guide">
    <div class="guide-card">
      <button id="guideClose" class="guide-close" aria-label="Close exercise guide">×</button>
      <div id="guideContent"></div>
    </div>
  </div>

  <input id="importInput" type="file" accept="application/json" class="hidden" />
  <script src="./health-model.js?v=3.1.0"></script>
  <script src="./exercise-instructions.js?v=3.1.0"></script>
  <script src="./cloud-sync.js?v=3.1.0"></script>
  <script src="./app.js?v=3.1.0"></script>
  <script src="./push-client.js?v=3.1.0"></script>
  <script src="./health-os.js?v=3.1.0"></script>
  <script src="./navigation.js?v=3.1.0"></script>
</body>
</html>
