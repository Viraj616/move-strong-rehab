name: Signed Samsung APK
on:
  push:
    branches: [gym-rebuild]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --no-pub
      - name: Build release and verify certificate
        env:
          SIGNING: ${{ secrets.ANDROID_RELEASE_SIGNING }}
        run: |
          set -euo pipefail
          umask 077
          export APK_KEYSTORE="$RUNNER_TEMP/movestrong.p12"
          trap 'rm -f "$APK_KEYSTORE"' EXIT
          jq -er .p12 <<< "$SIGNING" | base64 --decode > "$APK_KEYSTORE"
          APK_PASSWORD=$(jq -er .password <<< "$SIGNING")
          echo "::add-mask::$APK_PASSWORD"
          export APK_PASSWORD
          unset SIGNING
          flutter build apk --release --no-pub --no-tree-shake-icons --build-number="$GITHUB_RUN_NUMBER" --build-name="1.0.$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk Move-Strong.apk
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$tools" verify --verbose --print-certs Move-Strong.apk | tee "$RUNNER_TEMP/certificate.txt"
          grep -Fxi 'Signer #1 certificate SHA-256 digest: ed7c42e42e4e8cac6b50ef60c8569d2135af094823ee16344992c6b3e4672b15' "$RUNNER_TEMP/certificate.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: gym/Move-Strong.apk
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="gym-android-$GITHUB_RUN_NUMBER"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" Move-Strong.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" Move-Strong.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Move Strong 1.0.$GITHUB_RUN_NUMBER for Android" --notes "Download Move-Strong.apk on your Samsung and tap Install or Update."
          fi
